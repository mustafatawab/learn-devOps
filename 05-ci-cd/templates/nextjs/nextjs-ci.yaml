name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true   # informational only — won't block the PR

      - name: Type check
        run: npm run typecheck
        # fails the PR if TypeScript errors exist

      - name: Build
        run: npm run build
        env:
          # Add any build-time env vars your app needs
          # RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}